version: '3.8'

x-common-env: &common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # Changement vers PostgreSQL
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

services:
  # --- 1. Storage: PostgreSQL (Remplace MariaDB) ---
  postgres:
    image: postgres:13
    container_name: postgres_warehouse
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=sirene_dw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Le script d'init doit être adapté au format Postgres !
      - ./init_db:/docker-entrypoint-initdb.d
    networks:
      - data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sirene_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 2. Exploration: Jupyter Lab ---
  jupyter:
    image: jupyter/datascience-notebook:latest
    container_name: jupyter_lab
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      - JUPYTER_TOKEN=admin
    networks:
      - data_network

  # --- 3. Orchestration: Apache Airflow ---
  airflow-webserver:
    # On utilise l'image officielle directement (plus stable pour les drivers)
    image: apache/airflow:2.7.1
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8090:8080"
    env_file: .env
    environment:
      <<: *common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_network

  airflow-scheduler:
    image: apache/airflow:2.7.1
    container_name: airflow_scheduler
    command: scheduler
    environment:
      <<: *common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_network

  # --- 4. Visualization: Apache Superset ---
  superset:
    # Plus de build manuel, on prend l'officiel
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=AreYou
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data_network

  # --- 5. Governance: OpenMetadata ---
  openmetadata:
    image: openmetadata/server:1.2.0
    container_name: openmetadata
    ports:
      - "8585:8585"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      # Configuration spécifique pour Postgres
      - DB_DRIVER_CLASS=org.postgresql.Driver
      - DB_SCHEME=postgresql
      - DB_USER=openmetadata_user
      - DB_USER_PASSWORD=openmetadata_password
      - DB_DBNAME=openmetadata_db
      - SEARCH_TYPE=elasticsearch 
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    depends_on:
      - postgres
      - elasticsearch
    networks:
      - data_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - data_network

networks:
  data_network:

volumes:
  postgres_data: